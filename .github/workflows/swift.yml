name: Swift and iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Relay and release policy tests
        run: |
          python3 -m unittest discover -s server -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Owner-curated model dataset and local-only routing checks
        run: python3 -m unittest discover -s scripts/model -p 'test_*.py' -v
      - name: Core tests (Swift 6)
        run: |
          set -o pipefail
          swift test -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee core-tests.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iPhone project
        run: cd ios && xcodegen generate
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build 2>&1 | tee simulator-build.log
      - name: Build iPhone device SDK (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee iphone-build.log
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [d for runtime, values in devices.items() if 'iOS' in runtime for d in values if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Boot iPhone simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: iOS encrypted storage, permissions and launch tests
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test 2>&1 | tee ios-tests.log
      - name: Collect simulator and unsigned device apps
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/JarvisMobile.app JarvisMobile-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build-device/Build/Products/Debug-iphoneos/JarvisMobile.app JarvisMobile-iphone-unsigned.zip
      - name: Upload test evidence and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          path: |
            core-tests.log
            simulator-build.log
            iphone-build.log
            ios-tests.log
            TestResults.xcresult
            JarvisMobile-simulator.zip
            JarvisMobile-iphone-unsigned.zip
          retention-days: 14

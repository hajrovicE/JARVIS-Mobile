name: Swift and iOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Relay and release policy tests
        run: |
          python3 -m unittest discover -s server -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Owner-curated model dataset and local-only routing checks
        run: python3 -m unittest discover -s scripts/model -p 'test_*.py' -v
      - name: Core tests (Swift 6)
        run: |
          set -o pipefail
          swift test -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee core-tests.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Stage required real GGUF fixture
        run: |
          curl --fail --location --retry 3 --output ios/JarvisMobileTests/Fixtures/model.gguf 'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/daeb8e2d528a760970442092f6bf1e55c3b659eb/Qwen3-1.7B-Q4_K_M.gguf'
          printf '%s\n' 'Real inference is required for this CI run.' > ios/JarvisMobileTests/Fixtures/real-inference-required.txt
      - name: Generate iPhone project
        run: cd ios && xcodegen generate
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build 2>&1 | tee simulator-build.log
      - name: Build iPhone device SDK (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee iphone-build.log
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [d for runtime, values in devices.items() if 'iOS' in runtime for d in values if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Boot iPhone simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: iOS storage migration, real inference, permissions and UI tests
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) JARVIS_REAL_INFERENCE_REQUIRED' test 2>&1 | tee ios-tests.log
      - name: Collect simulator and unsigned device apps
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/JarvisMobile.app JarvisMobile-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build-device/Build/Products/Debug-iphoneos/JarvisMobile.app JarvisMobile-iphone-unsigned.zip
      - name: Upload test evidence and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          path: |
            core-tests.log
            simulator-build.log
            iphone-build.log
            ios-tests.log
            TestResults.xcresult
            JarvisMobile-simulator.zip
            JarvisMobile-iphone-unsigned.zip
          retention-days: 14

  real-local-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Build the pinned native runtime and run real local inference
        run: |
          set -o pipefail
          scripts/model/verify_runtime.sh "$RUNNER_TEMP/native" 2>&1 | tee real-local-inference.log
      - name: Upload real inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-local-inference-${{ github.sha }}
          path: real-local-inference.log
          retention-days: 14

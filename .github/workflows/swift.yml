name: Swift and iOS
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iPhone project
        run: cd ios && xcodegen generate
      - name: Build simulator app
        run: xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

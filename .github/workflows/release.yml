name: iOS Release preparation
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Default creates an unsigned Release build; signing/upload require paid membership and protected environment approval.'
        type: choice
        options: [build-only, sign-ipa, upload-testflight]
        default: build-only
        required: true
      build_number:
        description: 'Unique App Store build number (1–9999); increase for each upload.'
        type: string
        default: '3'
        required: true
permissions:
  contents: read
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false
env:
  DISTRIBUTION_MODE: ${{ inputs.distribution }}
  BUILD_NUMBER: ${{ inputs.build_number }}
  APPLE_DEVELOPER_MEMBERSHIP_ACTIVE: ${{ vars.APPLE_DEVELOPER_MEMBERSHIP_ACTIVE }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release policy without signing secrets
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 scripts/release/policy.py check-mode
  build-release:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests
        run: swift test
      - name: Generate iPhone project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build unsigned iPhone Release
        run: |
          set -o pipefail
          xcodebuild -project ios/JarvisMobile.xcodeproj -scheme JarvisMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-release CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee release-build.log
          ditto -c -k --sequesterRsrc --keepParent build-release/Build/Products/Release-iphoneos/JarvisMobile.app JarvisMobile-Release-unsigned.zip
          echo 'Unsigned Release build only. This file cannot be installed directly on an iPhone; no TestFlight upload was attempted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Store unsigned Release and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-${{ github.sha }}
          path: |
            JarvisMobile-Release-unsigned.zip
            release-build.log
          retention-days: 14
  sign-and-distribute:
    needs: [preflight, build-release]
    if: inputs.distribution != 'build-only' && vars.APPLE_DEVELOPER_MEMBERSHIP_ACTIVE == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    # Configure required reviewers and main-only deployment branches in repository Settings.
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secret completeness
        env: &signing-secrets
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: python3 scripts/release/policy.py check-signing
      - name: Generate Release project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Sign IPA and optionally request TestFlight upload
        env: *signing-secrets
        run: scripts/release/sign.sh
      - name: Always remove temporary keychain, profile and API material
        if: always()
        run: scripts/release/cleanup.sh
      - name: Store exported IPA and crash symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jarvis-release-output/*.ipa
            ${{ runner.temp }}/jarvis-release-output/*-dSYMs.zip
          if-no-files-found: ignore
          retention-days: 7

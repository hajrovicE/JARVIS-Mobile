name: JarvisMobile
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: '17.0'
packages:
  JarvisCore:
    path: ..
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    version: 2.10331.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  JarvisMobile:
    type: application
    platform: iOS
    sources:
      - path: JarvisMobile
        excludes: [Simulator.entitlements]
    dependencies:
      - package: JarvisCore
      - package: LlamaSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: JarvisMobile/Simulator.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSFaceIDUsageDescription: Hassas JARVIS işlemlerini onayınızla güvenli biçimde doğrulamak için Face ID kullanılır.
        NSMicrophoneUsageDescription: Türkçe sesli komutunuzu almak için mikrofon erişimi gerekir. İzin vermeden yazarak devam edebilirsiniz.
        NSSpeechRecognitionUsageDescription: Sesinizi cihaz üzerinde Türkçe komut metnine dönüştürmek için izin gerekir. Destek yoksa yazarak devam edebilirsiniz.
  JarvisMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/JarvisCoreTests
      - JarvisMobileTests
    dependencies:
      - target: JarvisMobile
      - package: JarvisCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.mobile.tests
  JarvisMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JarvisMobileUITests]
    dependencies:
      - target: JarvisMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.mobile.uitests
schemes:
  JarvisMobile:
    build:
      targets:
        JarvisMobile: all
    test:
      gatherCoverageData: true
      targets:
        - JarvisMobileTests
        - JarvisMobileUITests

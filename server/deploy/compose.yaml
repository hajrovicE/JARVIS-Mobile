name: jarvis-relay
services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 40s
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      APP_ACCESS_TOKEN_FILE: /run/secrets/app_access_token
      APP_ACCESS_TOKEN_EXPIRES_AT: ${APP_ACCESS_TOKEN_EXPIRES_AT:?Set an explicit Unix expiry; startup must not renew sessions}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      RELAY_REQUIRE_EXPLICIT_EXPIRY: "true"
      RELAY_REQUESTS_PER_MINUTE: ${RELAY_REQUESTS_PER_MINUTE:-6}
      RELAY_REQUESTS_PER_DAY: ${RELAY_REQUESTS_PER_DAY:-100}
      RELAY_MAX_CONCURRENT: ${RELAY_MAX_CONCURRENT:-2}
    secrets: [openai_api_key, app_access_token]
    networks: [relay_edge]
    # No ports:8787 mapping. Only the TLS proxy can reach the relay on this Docker network.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  caddy:
    # Official Caddy 2.11.9, pinned to the tested multi-platform manifest digest.
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:?Set the public DNS hostname without scheme or path}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate renewal contact email}
      # Never send the private upstream bearer through an ambient HTTP proxy.
      NO_PROXY: relay,localhost,127.0.0.1
      no_proxy: relay,localhost,127.0.0.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    networks: [relay_edge]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
secrets:
  openai_api_key:
    file: ${OPENAI_API_KEY_SECRET_FILE:?Set an absolute external server Secret file path}
  app_access_token:
    file: ${APP_ACCESS_TOKEN_SECRET_FILE:?Set an absolute external server Secret file path}
networks:
  relay_edge:
    driver: bridge
    # Not internal:true: the relay requires outbound TLS to the fixed OpenAI API destination.
    # This private user-defined network publishes only the Caddy ports above.
volumes:
  caddy_data:
  caddy_config:
